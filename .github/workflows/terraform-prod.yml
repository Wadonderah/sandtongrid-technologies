###############################################################################
# Terraform Production CI
# -----------------------------------------------------------------------------
# Step 1: Print the OIDC token claims so we can confirm the exact sub value
#         before creating IAM roles.
###############################################################################

name: Terraform Production

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-prod.yml"

  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-prod.yml"

env:
  TF_WORKING_DIR: infrastructure/environments/prod
  AWS_REGION: eu-west-1

jobs:

  ###########################################################################
  # Debug: Print OIDC token claims — temporary, remove after confirming sub
  ###########################################################################

  debug-oidc:
    name: Print OIDC Token Claims
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Print OIDC Token Claims
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')
          echo "=== Decoded OIDC JWT Claims ==="
          echo "$TOKEN" \
            | cut -d '.' -f2 \
            | tr '_-' '/+' \
            | base64 -d 2>/dev/null \
            | jq .
