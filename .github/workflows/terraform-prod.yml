name: Terraform Production

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-prod.yml"
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-prod.yml"

# Prevent concurrent production deployments. A run already in progress will
# be cancelled if a newer commit to main triggers another apply.
concurrency:
  group: terraform-production
  cancel-in-progress: true

env:
  TF_WORKING_DIR: infrastructure/environments/prod
  AWS_REGION: eu-west-1

permissions:
  contents: read
  id-token: write

jobs:
  terraform-check:
    name: Terraform Production Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-pr
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-pr
          retry-max-attempts: 3
      - name: Verify AWS Identity
        run: aws sts get-caller-identity
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  terraform-plan:
    name: Terraform Production Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug OIDC Token Subject (Plan)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "$TOKEN" | python3 -c "
          import sys, json, base64
          token = json.load(sys.stdin)['value']
          payload = token.split('.')[1]
          payload += '=' * (4 - len(payload) % 4)
          decoded = json.loads(base64.urlsafe_b64decode(payload))
          print('sub:', decoded.get('sub'))
          print('aud:', decoded.get('aud'))
          print('repository:', decoded.get('repository'))
          print('ref:', decoded.get('ref'))
          print('environment:', decoded.get('environment'))
          "

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-prod
          retry-max-attempts: 3

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Create Production Terraform Variables
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_WEBSITE_BUCKET_NAME: ${{ vars.TF_WEBSITE_BUCKET_NAME }}
          TF_LOGGING_BUCKET_NAME: ${{ vars.TF_LOGGING_BUCKET_NAME }}
          TF_DOMAIN_NAME: ${{ vars.TF_DOMAIN_NAME }}
          TF_SUBJECT_ALTERNATIVE_NAMES: ${{ vars.TF_SUBJECT_ALTERNATIVE_NAMES }}
          TF_HOSTED_ZONE_ID: ${{ vars.TF_HOSTED_ZONE_ID }}
        run: |
          TF_WEBSITE_BUCKET_NAME="$(printf '%s' "$TF_WEBSITE_BUCKET_NAME" | tr -d '\r\n')"
          TF_LOGGING_BUCKET_NAME="$(printf '%s' "$TF_LOGGING_BUCKET_NAME" | tr -d '\r\n')"
          TF_DOMAIN_NAME="$(printf '%s' "$TF_DOMAIN_NAME" | tr -d '\r\n')"
          TF_SUBJECT_ALTERNATIVE_NAMES="$(printf '%s' "$TF_SUBJECT_ALTERNATIVE_NAMES" | tr -d '\r\n')"
          TF_HOSTED_ZONE_ID="$(printf '%s' "$TF_HOSTED_ZONE_ID" | tr -d '\r\n')"
          cat > ci.tfvars <<TFVARS
          aws_region = "${AWS_REGION}"
          project_name = "Sandtongrid Technologies"
          environment = "prod"
          website_bucket_name = "${TF_WEBSITE_BUCKET_NAME}"
          logging_bucket_name = "${TF_LOGGING_BUCKET_NAME}"
          domain_name = "${TF_DOMAIN_NAME}"
          subject_alternative_names = [
            "${TF_SUBJECT_ALTERNATIVE_NAMES}"
          ]
          hosted_zone_id = "${TF_HOSTED_ZONE_ID}"
          TFVARS

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -var-file=ci.tfvars -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  ###########################################################################
  # Production Apply
  ###########################################################################

  terraform-apply:
    name: Terraform Production Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Gates this job behind the GitHub "production" environment.
    # Any required reviewers or branch restrictions configured on that
    # environment must pass before the job proceeds.
    environment: production
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug OIDC Token Subject
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "$TOKEN" | python3 -c "
          import sys, json, base64
          token = json.load(sys.stdin)['value']
          payload = token.split('.')[1]
          payload += '=' * (4 - len(payload) % 4)
          decoded = json.loads(base64.urlsafe_b64decode(payload))
          print('sub:', decoded.get('sub'))
          print('aud:', decoded.get('aud'))
          print('environment:', decoded.get('environment'))
          "

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-apply
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan
