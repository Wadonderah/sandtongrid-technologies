###############################################################################
# Terraform Production CI
# -----------------------------------------------------------------------------
# Purpose:
# Validate and plan the production infrastructure.
#
# Security model:
# - Pull requests perform Terraform checks without AWS credentials.
# - Pushes to main use GitHub Actions OIDC to assume the production IAM role.
# - AWS credentials are never stored in GitHub.
#
# Why this separation exists:
# Production AWS access should not be granted to arbitrary pull-request
# workflows. The production deployment role is trusted only by the main branch.
###############################################################################

name: Terraform Production

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-prod.yml"

  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-prod.yml"

permissions:
  contents: read

env:
  TF_WORKING_DIR: infrastructure/environments/prod
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::809306106692:role/sandtongrid-github-actions-pr

jobs:

  ###########################################################################
  # Pull Request Terraform Checks
  #
  # No AWS credentials are configured here.
  # This keeps production AWS access away from pull-request workflows.
  ###########################################################################

  terraform-check:

    name: Terraform Production Checks
    runs-on: ubuntu-latest

    steps:

      #########################################################################
      # Checkout Repository
      #########################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################################################
      # Setup Terraform
      #########################################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      #########################################################################
      # Terraform Format Check
      #########################################################################

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      #########################################################################
      # Terraform Initialization
      #########################################################################

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      #########################################################################
      # Terraform Validation
      #########################################################################

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  ###########################################################################
  # Production Terraform Plan
  #
  # This job runs only after changes reach main.
  #
  # The IAM trust policy explicitly trusts:
  # repo:Wadonderah/sandtongrid-technologies:ref:refs/heads/main
  #
  # Therefore the GitHub OIDC token and AWS IAM trust relationship match.
  ###########################################################################

  terraform-plan:

    name: Terraform Production Plan
    runs-on: ubuntu-latest

    # Production AWS access is intentionally restricted to pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:

      #########################################################################
      # Checkout Repository
      #########################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################################################
      # Setup Terraform
      #########################################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      #########################################################################
      # Configure AWS Through GitHub OIDC
      #
      # No static AWS credentials are stored in GitHub.
      # GitHub obtains a temporary identity and assumes the production role.
      #########################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      #########################################################################
      # Verify AWS Identity
      #########################################################################

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      #########################################################################
      # Create CI Terraform Variables
      #
      # terraform.tfvars is intentionally excluded from Git.
      #
      # GitHub repository variables provide the production values.
      # The temporary ci.tfvars file exists only on the GitHub runner.
      #########################################################################

      - name: Create Production Terraform Variables
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_WEBSITE_BUCKET_NAME: ${{ vars.TF_WEBSITE_BUCKET_NAME }}
          TF_LOGGING_BUCKET_NAME: ${{ vars.TF_LOGGING_BUCKET_NAME }}
          TF_DOMAIN_NAME: ${{ vars.TF_DOMAIN_NAME }}
          TF_SUBJECT_ALTERNATIVE_NAMES: ${{ vars.TF_SUBJECT_ALTERNATIVE_NAMES }}
          TF_HOSTED_ZONE_ID: ${{ vars.TF_HOSTED_ZONE_ID }}
        run: |
          # Remove accidental line breaks from GitHub repository variables.
          TF_WEBSITE_BUCKET_NAME="$(printf '%s' "$TF_WEBSITE_BUCKET_NAME" | tr -d '\r\n')"
          TF_LOGGING_BUCKET_NAME="$(printf '%s' "$TF_LOGGING_BUCKET_NAME" | tr -d '\r\n')"
          TF_DOMAIN_NAME="$(printf '%s' "$TF_DOMAIN_NAME" | tr -d '\r\n')"
          TF_SUBJECT_ALTERNATIVE_NAMES="$(printf '%s' "$TF_SUBJECT_ALTERNATIVE_NAMES" | tr -d '\r\n')"
          TF_HOSTED_ZONE_ID="$(printf '%s' "$TF_HOSTED_ZONE_ID" | tr -d '\r\n')"

          cat > ci.tfvars <<EOF
          ###############################################################################
          # Production CI Terraform Variables
          # -----------------------------------------------------------------------------
          # Generated temporarily during the GitHub Actions run.
          # This file is never committed to the repository.
          ###############################################################################

          aws_region = "${AWS_REGION}"

          project_name = "Sandtongrid Technologies"

          environment = "prod"

          website_bucket_name = "${TF_WEBSITE_BUCKET_NAME}"

          logging_bucket_name = "${TF_LOGGING_BUCKET_NAME}"

          domain_name = "${TF_DOMAIN_NAME}"

          subject_alternative_names = [
            "${TF_SUBJECT_ALTERNATIVE_NAMES}"
          ]

          hosted_zone_id = "${TF_HOSTED_ZONE_ID}"
          EOF

      #########################################################################
      # Terraform Format Check
      #########################################################################

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      #########################################################################
      # Terraform Initialization
      #########################################################################

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      #########################################################################
      # Terraform Validation
      #########################################################################

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      #########################################################################
      # Terraform Production Plan
      #########################################################################

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -var-file=ci.tfvars