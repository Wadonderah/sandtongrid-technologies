###############################################################################
# Terraform Production CI
# -----------------------------------------------------------------------------
# Purpose:
# Validate and plan the production infrastructure using GitHub Actions OIDC.
#
# AWS credentials are never stored in GitHub.
# GitHub assumes the dedicated production IAM role using OIDC.
#
# Production Terraform input values are supplied through GitHub Actions
# repository variables because terraform.tfvars is intentionally excluded
# from version control.
###############################################################################

name: Terraform Production

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-prod.yml"

  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-prod.yml"

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: infrastructure/environments/prod
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::809306106692:role/sandtongrid-github-actions-prod

jobs:

  terraform-plan:

    name: Terraform Production Plan
    runs-on: ubuntu-latest

    steps:

      #########################################################################
      # Checkout Repository
      #########################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################################################
      # Setup Terraform
      #########################################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      #########################################################################
      # Configure AWS Through GitHub OIDC
      #########################################################################
      # GitHub obtains temporary AWS credentials by assuming the dedicated
      # production IAM role through the configured OIDC trust relationship.
      #########################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      #########################################################################
      # Verify AWS Identity
      #########################################################################

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      #########################################################################
      # Create CI Terraform Variables
      #########################################################################
      # terraform.tfvars is intentionally ignored by Git.
      #
      # GitHub Actions therefore creates a temporary CI-specific variables
      # file from repository variables during the workflow run.
      #
      # The file exists only inside the GitHub runner and is never committed.
      #########################################################################

      - name: Create Production Terraform Variables
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_WEBSITE_BUCKET_NAME: ${{ vars.TF_WEBSITE_BUCKET_NAME }}
          TF_LOGGING_BUCKET_NAME: ${{ vars.TF_LOGGING_BUCKET_NAME }}
          TF_DOMAIN_NAME: ${{ vars.TF_DOMAIN_NAME }}
          TF_SUBJECT_ALTERNATIVE_NAMES: ${{ vars.TF_SUBJECT_ALTERNATIVE_NAMES }}
          TF_HOSTED_ZONE_ID: ${{ vars.TF_HOSTED_ZONE_ID }}
        run: |
          TF_WEBSITE_BUCKET_NAME="$(printf '%s' "$TF_WEBSITE_BUCKET_NAME" | tr -d '\r\n')"
          TF_LOGGING_BUCKET_NAME="$(printf '%s' "$TF_LOGGING_BUCKET_NAME" | tr -d '\r\n')"
          TF_DOMAIN_NAME="$(printf '%s' "$TF_DOMAIN_NAME" | tr -d '\r\n')"
          TF_SUBJECT_ALTERNATIVE_NAMES="$(printf '%s' "$TF_SUBJECT_ALTERNATIVE_NAMES" | tr -d '\r\n')"
          TF_HOSTED_ZONE_ID="$(printf '%s' "$TF_HOSTED_ZONE_ID" | tr -d '\r\n')"

          cat > ci.tfvars <<EOF
          ###############################################################################
          # Production CI Terraform Variables
          # -----------------------------------------------------------------------------
          # This file is generated during the GitHub Actions run.
          # It is intentionally not committed to the repository.
          ###############################################################################

          aws_region = "${AWS_REGION}"

          project_name = "Sandtongrid Technologies"

          environment = "prod"

          website_bucket_name = "${TF_WEBSITE_BUCKET_NAME}"

          logging_bucket_name = "${TF_LOGGING_BUCKET_NAME}"

          domain_name = "${TF_DOMAIN_NAME}"

          subject_alternative_names = [
            "${TF_SUBJECT_ALTERNATIVE_NAMES}"
          ]

          hosted_zone_id = "${TF_HOSTED_ZONE_ID}"
          EOF

      #########################################################################
      # Terraform Format Check
      #########################################################################

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      #########################################################################
      # Terraform Initialization
      #########################################################################

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      #########################################################################
      # Terraform Validation
      #########################################################################

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      #########################################################################
      # Terraform Plan
      #########################################################################
      # Explicitly use the CI-generated variable file because the normal
      # terraform.tfvars file is intentionally not stored in Git.
      #########################################################################

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -var-file=ci.tfvars