###############################################################################
# Publish Docker Image to GitHub Container Registry
###############################################################################

name: Publish Docker Image

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: sandtongrid-website

jobs:
  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      #########################################################################
      # LOGIN TO GHCR
      #########################################################################

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: wadonderah
          password: ${{ secrets.GITHUB_TOKEN }}

      #########################################################################
      # BUILD & PUSH
      #########################################################################

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.website
          push: true
          tags: |
            ghcr.io/wadonderah/sandtongrid-website:latest
            ghcr.io/wadonderah/sandtongrid-website:${{ github.sha }}