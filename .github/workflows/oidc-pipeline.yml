name: OIDC CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  TF_WORKING_DIR: infrastructure/environments/prod
  IMAGE_NAME: sandtongrid-website
  NODE_VERSION: "24"

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Job: Detect Changes
# Determines which parts of the repo changed so downstream jobs can skip
# work they don't need to do.
# ---------------------------------------------------------------------------
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            files="$(git diff --name-only "$PR_BASE...$PR_HEAD")"
          elif [[ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            files="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA")"
          else
            files="$(git ls-tree -r --name-only "$PUSH_SHA")"
          fi

          if printf '%s\n' "$files" | grep -Eq '^(infrastructure/|\.github/workflows/)'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$files" | grep -Eq '^(apps/website/|docker/|\.github/workflows/)'; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          else
            echo "website=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Job: Website CI  (runs on every push/PR when website files change)
  # Builds the Docker image, smoke-tests it, then lints and builds the source.
  # ---------------------------------------------------------------------------
  website-ci:
    name: Website CI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.website == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.website
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci

      - name: Start Container
        run: docker run -d --name website -p 8080:80 ${{ env.IMAGE_NAME }}:ci

      - name: Wait for Nginx
        run: sleep 10

      - name: Smoke Test
        run: curl --fail --silent --show-error http://localhost:8080

      - name: Stop Container
        if: always()
        run: |
          docker stop website || true
          docker rm   website || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install Dependencies
        working-directory: apps/website
        run: npm ci

      - name: Lint
        working-directory: apps/website
        run: npm run lint

      - name: Build
        working-directory: apps/website
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job: Terraform Checks  (PR only, when infra changes)
  # Validates Terraform formatting and configuration against AWS via OIDC.
  # ---------------------------------------------------------------------------
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-pr
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-checks
          retry-max-attempts: 3

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Job: Terraform Plan  (main push only, when infra changes)
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.infra == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-plan
          retry-max-attempts: 3

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Write Terraform Variables
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_WEBSITE_BUCKET_NAME: ${{ vars.TF_WEBSITE_BUCKET_NAME }}
          TF_LOGGING_BUCKET_NAME: ${{ vars.TF_LOGGING_BUCKET_NAME }}
          TF_DOMAIN_NAME: ${{ vars.TF_DOMAIN_NAME }}
          TF_SUBJECT_ALTERNATIVE_NAMES: ${{ vars.TF_SUBJECT_ALTERNATIVE_NAMES }}
          TF_HOSTED_ZONE_ID: ${{ vars.TF_HOSTED_ZONE_ID }}
        run: |
          # Strip any accidental whitespace from repo variables
          bucket=$(printf '%s' "$TF_WEBSITE_BUCKET_NAME"       | tr -d '\r\n')
          logging=$(printf '%s' "$TF_LOGGING_BUCKET_NAME"      | tr -d '\r\n')
          domain=$(printf '%s' "$TF_DOMAIN_NAME"               | tr -d '\r\n')
          sans=$(printf '%s' "$TF_SUBJECT_ALTERNATIVE_NAMES"   | tr -d '\r\n')
          zone=$(printf '%s' "$TF_HOSTED_ZONE_ID"              | tr -d '\r\n')

          cat > ci.tfvars <<TFVARS
          aws_region                 = "${AWS_REGION}"
          project_name               = "Sandtongrid Technologies"
          environment                = "prod"
          website_bucket_name        = "${bucket}"
          logging_bucket_name        = "${logging}"
          domain_name                = "${domain}"
          subject_alternative_names  = ["${sans}"]
          hosted_zone_id             = "${zone}"
          TFVARS

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -var-file=ci.tfvars -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job: Terraform Apply  (main push only, after plan, requires approval)
  # ---------------------------------------------------------------------------
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-apply
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan

  # ---------------------------------------------------------------------------
  # Job: Deploy Website  (main push only, after apply)
  # Builds the website and syncs to S3, then invalidates CloudFront.
  # ---------------------------------------------------------------------------
  deploy-website:
    name: Deploy Website
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install Dependencies
        working-directory: apps/website
        run: npm ci

      - name: Build Website
        working-directory: apps/website
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-website
          retry-max-attempts: 3

      - name: Setup Terraform (read outputs)
        uses: hashicorp/setup-terraform@v3

      - name: Read Terraform Outputs
        id: tf-outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          echo "bucket=$(terraform output -raw website_bucket_id)"         >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: |
          aws s3 sync apps/website/dist "s3://${{ steps.tf-outputs.outputs.bucket }}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.html"
          # HTML files get shorter cache so deploys propagate quickly
          aws s3 sync apps/website/dist "s3://${{ steps.tf-outputs.outputs.bucket }}" \
            --delete \
            --cache-control "public, no-cache" \
            --include "*.html"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf-outputs.outputs.distribution }}" \
            --paths "/*"

  # ---------------------------------------------------------------------------
  # Job: Publish Image  (main push only)
  # Publishes the Docker image to GHCR after website-ci passes.
  # ---------------------------------------------------------------------------
  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: website-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.website
          push: true
          tags: |
            ghcr.io/wadonderah/sandtongrid-website:latest
            ghcr.io/wadonderah/sandtongrid-website:${{ github.sha }}
