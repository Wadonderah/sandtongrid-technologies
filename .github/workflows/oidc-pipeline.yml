name: OIDC CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: oidc-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_WORKING_DIR: infrastructure/environments/prod
  AWS_REGION: eu-west-1
  IMAGE_NAME: sandtongrid-website

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Terraform and Website Changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          elif [[ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA")"
          else
            changed_files="$(git ls-tree -r --name-only "$PUSH_SHA")"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(infrastructure/|apps/website/|\.github/workflows/)'; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi

  terraform-check:
    name: Terraform Production Checks
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.terraform == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-pr
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-pr
          retry-max-attempts: 3

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  terraform-plan:
    name: Terraform Production Plan
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.terraform == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-prod
          retry-max-attempts: 3

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Create Production Terraform Variables
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_WEBSITE_BUCKET_NAME: ${{ vars.TF_WEBSITE_BUCKET_NAME }}
          TF_LOGGING_BUCKET_NAME: ${{ vars.TF_LOGGING_BUCKET_NAME }}
          TF_DOMAIN_NAME: ${{ vars.TF_DOMAIN_NAME }}
          TF_SUBJECT_ALTERNATIVE_NAMES: ${{ vars.TF_SUBJECT_ALTERNATIVE_NAMES }}
          TF_HOSTED_ZONE_ID: ${{ vars.TF_HOSTED_ZONE_ID }}
        run: |
          TF_WEBSITE_BUCKET_NAME="$(printf '%s' "$TF_WEBSITE_BUCKET_NAME" | tr -d '\r\n')"
          TF_LOGGING_BUCKET_NAME="$(printf '%s' "$TF_LOGGING_BUCKET_NAME" | tr -d '\r\n')"
          TF_DOMAIN_NAME="$(printf '%s' "$TF_DOMAIN_NAME" | tr -d '\r\n')"
          TF_SUBJECT_ALTERNATIVE_NAMES="$(printf '%s' "$TF_SUBJECT_ALTERNATIVE_NAMES" | tr -d '\r\n')"
          TF_HOSTED_ZONE_ID="$(printf '%s' "$TF_HOSTED_ZONE_ID" | tr -d '\r\n')"
          cat > ci.tfvars <<TFVARS
          aws_region = "${AWS_REGION}"
          project_name = "Sandtongrid Technologies"
          environment = "prod"
          website_bucket_name = "${TF_WEBSITE_BUCKET_NAME}"
          logging_bucket_name = "${TF_LOGGING_BUCKET_NAME}"
          domain_name = "${TF_DOMAIN_NAME}"
          subject_alternative_names = [
            "${TF_SUBJECT_ALTERNATIVE_NAMES}"
          ]
          hosted_zone_id = "${TF_HOSTED_ZONE_ID}"
          TFVARS

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -var-file=ci.tfvars -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform Production Apply
    runs-on: ubuntu-latest
    needs:
      - changes
      - terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.terraform == 'true'
    environment: production
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-apply
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan

  website-deploy:
    name: Deploy Production Website
    runs-on: ubuntu-latest
    needs:
      - changes
      - terraform-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.terraform == 'true'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Website
        working-directory: apps/website
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional --os=linux --cpu=x64 --libc=glibc
          npm run build

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809306106692:role/sandtongrid-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-website-deploy
          retry-max-attempts: 3

      - name: Read Production Terraform Outputs
        id: terraform-outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          echo "bucket_name=$(terraform output -raw website_bucket_id)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Upload Website to S3
        env:
          WEBSITE_BUCKET: ${{ steps.terraform-outputs.outputs.bucket_name }}
        run: aws s3 sync apps/website/dist "s3://${WEBSITE_BUCKET}" --delete

      - name: Invalidate CloudFront Cache
        env:
          DISTRIBUTION_ID: ${{ steps.terraform-outputs.outputs.distribution_id }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

  docker-ci:
    name: Build and Smoke Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.website
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Start Container
        run: docker run -d --name website -p 8080:80 $IMAGE_NAME:latest

      - name: Wait for Startup
        run: sleep 10

      - name: Verify Website
        run: curl --fail http://localhost:8080

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint Website
        working-directory: apps/website
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional --os=linux --cpu=x64 --libc=glibc
          npm run lint

      - name: Build Website
        working-directory: apps/website
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional --os=linux --cpu=x64 --libc=glibc
          npm run build

      - name: Cleanup Container
        if: always()
        run: |
          docker stop website || true
          docker rm website || true

  publish-image:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.website
          push: true
          tags: |
            ghcr.io/wadonderah/sandtongrid-website:latest
            ghcr.io/wadonderah/sandtongrid-website:${{ github.sha }}
